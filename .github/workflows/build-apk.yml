name: Build APK

# Builds the debug APK and publishes it as a downloadable release asset.
# Runs on every push to the dev branch, and can be triggered manually.
on:
  push:
    branches:
      - claude/mobile-legends-maphack-6ikgsw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MLBB-Advisor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Advisor-apk
          path: dist/MLBB-Advisor.apk
          if-no-files-found: error

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MLBB Advisor (latest debug build)
          body: |
            Auto-built debug APK of the MLBB Advisor app.

            Download `MLBB-Advisor.apk` below, copy it to your Android phone,
            and install it (you may need to allow "Install unknown apps" for
            your file manager / browser). On first launch, grant the
            "Display over other apps" permission.

            This is a knowledge-base build/tips advisor — it reads nothing
            from the game.
          files: dist/MLBB-Advisor.apk
          prerelease: true
