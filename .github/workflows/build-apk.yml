name: Build APK

# Builds the debug APK and publishes it as a downloadable release asset.
# Uses only GitHub-authored actions/* plus tooling preinstalled on the
# ubuntu-latest runner (Android SDK + gh CLI) to stay compatible with
# repos that restrict third-party actions.
on:
  push:
    branches:
      - claude/mobile-legends-maphack-6ikgsw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MLBB-Advisor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Advisor-apk
          path: dist/MLBB-Advisor.apk
          if-no-files-found: error

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dist/MLBB-Advisor.apk \
            --title "MLBB Advisor (latest debug build)" \
            --prerelease \
            --notes "Auto-built debug APK of the MLBB Advisor app. Download MLBB-Advisor.apk below, copy it to your Android phone and install it (allow 'Install unknown apps' if prompted). On first launch, grant the 'Display over other apps' permission. This is a knowledge-base build/tips advisor — it reads nothing from the game."
